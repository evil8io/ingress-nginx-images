name: build

on:
  schedule:
    - cron: "15 6 * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag of the fork to build, for example controller-v1.15.16; empty builds the highest release tag"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}

env:
  UPSTREAM_REPO: chainguard-forks/ingress-nginx
  IMAGE_PREFIX: ghcr.io/evil8io/images/ingress-nginx

jobs:
  resolve:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      version: ${{ steps.resolve.outputs.version }}
      variants: ${{ steps.resolve.outputs.variants }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag || '' }}
        run: |
          set -euo pipefail
          pattern='^controller-v[0-9]+\.[0-9]+\.[0-9]+$'
          tag="${INPUT_TAG}"
          if [[ -z "${tag}" ]]; then
            tag=$(gh api --paginate "repos/${UPSTREAM_REPO}/git/matching-refs/tags/controller-v" \
              --jq '.[].ref | sub("^refs/tags/"; "")' \
              | grep -E "${pattern}" | sort -V | tail -1)
          fi
          if [[ ! "${tag}" =~ ${pattern} ]]; then
            echo "the tag '${tag}' does not match ${pattern}"
            exit 1
          fi
          sha=$(gh api "repos/${UPSTREAM_REPO}/commits/${tag}" --jq '.sha')
          version="${tag#controller-}"
          manifest_status() {
            local name="${IMAGE_PREFIX#ghcr.io/}/$1" token
            token=$(curl -sS "https://ghcr.io/token?service=ghcr.io&scope=repository:${name}:pull" \
              | jq -r '.token // empty') || true
            curl -sS -o /dev/null -w '%{http_code}' \
              -H "Authorization: Bearer ${token}" \
              -H 'Accept: application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.list.v2+json' \
              "https://ghcr.io/v2/${name}/manifests/${version}" || true
          }
          all=(controller controller-chroot)
          missing=()
          if [[ -n "${INPUT_TAG}" ]]; then
            missing=("${all[@]}")
          else
            for variant in "${all[@]}"; do
              status=$(manifest_status "${variant}")
              case "${status}" in
                200) echo "${variant}:${version} is already published" ;;
                404) missing+=("${variant}") ;;
                *)
                  echo "ghcr.io returned HTTP status '${status}' for ${variant}:${version} without credentials"
                  exit 1
                  ;;
              esac
            done
          fi
          variants=$(jq -cn '$ARGS.positional' --args "${missing[@]}")
          {
            echo "sha=${sha}"
            echo "version=${version}"
            echo "variants=${variants}"
          } >> "$GITHUB_OUTPUT"
          echo "${tag} (${sha}) -> ${version} (variants to build: ${variants})"
      - name: Keepalive
        if: steps.resolve.outputs.variants == '[]' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          last=$(git log -1 --format=%ct)
          if (( $(date +%s) - last <= 50 * 86400 )); then
            echo "last commit is recent enough"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "chore: keepalive"
          git push

  build:
    needs: resolve
    if: needs.resolve.outputs.variants != '[]'
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(needs.resolve.outputs.variants) }}
        arch: [amd64, arm64]
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    permissions:
      contents: read
      packages: write
    outputs:
      controller_amd64: ${{ steps.push.outputs.controller_amd64 }}
      controller_arm64: ${{ steps.push.outputs.controller_arm64 }}
      controller_chroot_amd64: ${{ steps.push.outputs.controller_chroot_amd64 }}
      controller_chroot_arm64: ${{ steps.push.outputs.controller_chroot_arm64 }}
    env:
      VARIANT: ${{ matrix.variant }}
      ARCH: ${{ matrix.arch }}
      SHA: ${{ needs.resolve.outputs.sha }}
      VERSION: ${{ needs.resolve.outputs.version }}
      LOCAL_PREFIX: localhost/ingress-nginx
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: self
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ needs.resolve.outputs.sha }}
          fetch-depth: 1
          path: upstream
          persist-credentials: false
      - name: Build the binaries
        working-directory: upstream
        run: |
          set -euo pipefail
          go_minor=$(cut -d. -f1,2 GOLANG_VERSION)
          if [[ ! "${go_minor}" =~ ^[0-9]+\.[0-9]+$ ]]; then
            echo "GOLANG_VERSION does not contain a Go version: '${go_minor}'"
            exit 1
          fi
          docker run --rm \
            --volume "${PWD}:/go/src/k8s.io/ingress-nginx" \
            --workdir /go/src/k8s.io/ingress-nginx \
            --env PKG=k8s.io/ingress-nginx \
            --env ARCH \
            --env "TAG=${VERSION}" \
            --env "COMMIT_SHA=git-${SHA:0:7}" \
            --env "REPO_INFO=https://github.com/${UPSTREAM_REPO}" \
            "golang:${go_minor}-alpine" \
            /bin/sh -ec 'go version; /bin/sh build/build.sh'
      - name: Build the NGINX base image
        working-directory: upstream
        run: docker buildx build --load --provenance=false --tag "${LOCAL_PREFIX}/nginx:${VERSION}" images/nginx/rootfs
      - name: Build the controller image
        working-directory: upstream
        run: |
          set -euo pipefail
          file=rootfs/Dockerfile
          if [[ "${VARIANT}" == controller-chroot ]]; then
            file=rootfs/Dockerfile-chroot
          fi
          docker buildx build --load --provenance=false --no-cache \
            --build-arg "BASE_IMAGE=${LOCAL_PREFIX}/nginx:${VERSION}" \
            --build-arg "VERSION=${VERSION}" \
            --build-arg "TARGETARCH=${ARCH}" \
            --build-arg "COMMIT_SHA=git-${SHA:0:7}" \
            --file "${file}" \
            --tag "${LOCAL_PREFIX}/${VARIANT}:${VERSION}" rootfs
      - name: Add the license and the labels
        run: |
          set -euo pipefail
          docker buildx build --load --provenance=false \
            --build-arg "CONTROLLER_IMAGE=${LOCAL_PREFIX}/${VARIANT}:${VERSION}" \
            --tag "${IMAGE_PREFIX}/${VARIANT}:${VERSION}-${ARCH}" self
      - name: Verify the image
        run: |
          set -euo pipefail
          base="${LOCAL_PREFIX}/nginx:${VERSION}"
          image="${IMAGE_PREFIX}/${VARIANT}:${VERSION}-${ARCH}"
          caps=(--cap-drop ALL --cap-add NET_BIND_SERVICE)
          if [[ "${VARIANT}" == controller-chroot ]]; then
            caps+=(--cap-add SYS_CHROOT --cap-add SYS_ADMIN)
            nginx_sum() { docker run --rm --entrypoint sha256sum "$1" "$2" | cut -d' ' -f1; }
            want=$(nginx_sum "${base}" /usr/local/nginx/sbin/nginx)
            got=$(nginx_sum "${image}" /chroot/usr/local/nginx/sbin/nginx)
            echo "nginx binary: base ${want}, chroot ${got}"
            if [[ -z "${want}" || "${want}" != "${got}" ]]; then
              echo "the nginx binary of the chroot image is not the binary of the NGINX base image of this run"
              exit 1
            fi
          else
            layers() { docker image inspect --format '{{json .RootFS.Layers}}' "$1"; }
            base_layers=$(layers "${base}")
            image_layers=$(layers "${image}")
            if ! jq -en --argjson base "${base_layers}" --argjson image "${image_layers}" \
              '($base | length) > 0 and $image[:($base | length)] == $base' >/dev/null; then
              echo "the controller image is not built on the NGINX base image of this run"
              exit 1
            fi
          fi
          docker run --rm "${caps[@]}" "${image}" /nginx-ingress-controller --version | tee version.txt
          grep -qE "Release:[[:space:]]+${VERSION}[[:space:]]*$" version.txt
          grep -q 'nginx version: nginx/' version.txt
          docker image inspect --format '{{json .Config.Labels}}' "${image}" | jq .
      - name: Push the image
        id: push
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          image="${IMAGE_PREFIX}/${VARIANT}:${VERSION}-${ARCH}"
          docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin <<<"${GH_TOKEN}"
          docker push "${image}"
          digest=$(docker buildx imagetools inspect "${image}" --format '{{json .Manifest}}' | jq -r '.digest')
          if [[ ! "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "the registry did not return a digest for ${image}: '${digest}'"
            exit 1
          fi
          echo "${VARIANT//-/_}_${ARCH}=${digest}" >> "$GITHUB_OUTPUT"
          echo "${image}@${digest}"

  merge:
    needs: [resolve, build]
    if: ${{ !cancelled() && needs.resolve.result == 'success' && needs.resolve.outputs.variants != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(needs.resolve.outputs.variants) }}
    runs-on: ubuntu-latest
    permissions:
      packages: write
    env:
      VARIANT: ${{ matrix.variant }}
      VERSION: ${{ needs.resolve.outputs.version }}
      DIGESTS: ${{ toJSON(needs.build.outputs) }}
    steps:
      - name: Merge and verify the manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repository="${IMAGE_PREFIX}/${VARIANT}"
          sources=()
          for arch in amd64 arm64; do
            digest=$(jq -r --arg key "${VARIANT//-/_}_${arch}" '.[$key] // empty' <<<"${DIGESTS}")
            if [[ -z "${digest}" ]]; then
              echo "the ${arch} build of ${VARIANT} did not push an image in this run"
              exit 1
            fi
            sources+=("${repository}@${digest}")
          done
          docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin <<<"${GH_TOKEN}"
          docker buildx imagetools create -t "${repository}:${VERSION}" "${sources[@]}"
          out=$(docker buildx imagetools inspect "${repository}:${VERSION}")
          echo "${out}"
          grep -q 'linux/amd64' <<<"${out}"
          grep -q 'linux/arm64' <<<"${out}"
          {
            echo '```'
            echo "${out}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
